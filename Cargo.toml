[package]
name = "naval_window"
version = "0.1.0"
edition = "2024"
resolver = "2"

[dependencies]
naval_sketch = { path = "../naval_sketch/crates/naval_sketch", features = ["bevy"] }
#bevy = { version = "0.18.0", features = ["dynamic_linking", "wayland", "dev", "hotpatching"]}
bevy = { version = "0.18.0", features = ["dynamic_linking", "wayland", "dev"]}
#dioxus-devtools = "0.7.3" #included to fix the version because this is used in bevy's hotpatching
#notify-debouncer-full = "^0.6.0"
anyhow = {  version = "1.0.101" , features = ["backtrace"]}
dirs = "6.0.0"
rand = "0.9.2"
isosurface = "0.0.4"


# Enable max optimizations for dependencies, but not for our code:
[profile.dev.package."*"]
opt-level = 3

# Enable only a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
opt-level = 'z'
